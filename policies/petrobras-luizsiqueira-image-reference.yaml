apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: petrobras-luizsiqueira-image-reference
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  background: false
  rules:
    - name: require-versioned-image
      match:
        any:
          - resources:
              kinds: [Pod]
              namespaces: [petrobras-luizsiqueira]
      validate:
        failureAction: Enforce
        cel:
          expressions:
            - expression: >-
                object.spec.containers.all(c,
                  !c.image.matches(':latest(@|$)') &&
                  (c.image.matches('(^|/)[^/:@]+:[^/:@]+$') ||
                   c.image.matches('@sha256:[a-f0-9]{64}$')))
              message: "Containers devem usar tag explicita diferente de latest ou digest SHA-256."
            - expression: >-
                !has(object.spec.initContainers) || object.spec.initContainers.all(c,
                  !c.image.matches(':latest(@|$)') &&
                  (c.image.matches('(^|/)[^/:@]+:[^/:@]+$') ||
                   c.image.matches('@sha256:[a-f0-9]{64}$')))
              message: "Init containers devem usar tag explicita diferente de latest ou digest SHA-256."
            - expression: >-
                !has(object.spec.ephemeralContainers) || object.spec.ephemeralContainers.all(c,
                  !c.image.matches(':latest(@|$)') &&
                  (c.image.matches('(^|/)[^/:@]+:[^/:@]+$') ||
                   c.image.matches('@sha256:[a-f0-9]{64}$')))
              message: "Ephemeral containers devem usar tag explicita diferente de latest ou digest SHA-256."
