services:
  nexus:
    image: sonatype/nexus3:3.89.3
    ports:
      - "127.0.0.1:8081:8081"
      - "127.0.0.1:5001:5001"
    volumes:
      - nexus-data:/nexus-data
    networks:
      default:
      kind:
        aliases:
          - petrobras-luizsiqueira-nexus

volumes:
  nexus-data:

networks:
  kind:
    external: true
    name: kind
